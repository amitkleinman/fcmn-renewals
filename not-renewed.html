<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>לא חידשו מנוי</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --panel2:#1f2330; --border:#2b3040;
    --text:#e8eaf0; --muted:#9aa3b5; --accent:#f5c518; --accent2:#2dd4a3;
    --danger:#ef5b5b;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{font-family:"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; direction:rtl}
  header{
    position:sticky; top:0; z-index:5;
    background:linear-gradient(180deg,#14161c,#14161cee);
    backdrop-filter:blur(6px); padding:14px 20px;
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  h1{font-size:18px; display:flex; align-items:center; gap:8px}
  h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .nav-btn{
    font-size:11.5px; color:var(--muted); border:1px solid var(--border);
    padding:5px 10px; border-radius:7px; text-decoration:none;
    background:var(--panel2); margin-right:auto;
  }
  .upload-area{
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px;
    padding:20px;
  }
  .upload-box{
    border:2px dashed var(--border); border-radius:12px;
    padding:24px; text-align:center; cursor:pointer;
    transition:border-color .2s;
    background:var(--panel);
  }
  .upload-box:hover, .upload-box.dragover{border-color:var(--accent)}
  .upload-box.loaded{border-color:var(--accent2); border-style:solid}
  .upload-box .icon{font-size:28px; margin-bottom:8px}
  .upload-box .label{font-size:14px; font-weight:600; margin-bottom:4px}
  .upload-box .sub{font-size:11.5px; color:var(--muted)}
  .upload-box .count{font-size:12px; color:var(--accent2); margin-top:6px; font-weight:600}
  input[type=file]{display:none}
  .controls{
    padding:0 20px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .btn{
    padding:9px 18px; border-radius:8px; border:none; cursor:pointer;
    font-size:13px; font-weight:600; font-family:inherit;
  }
  .btn-primary{background:var(--accent); color:#000}
  .btn-export{background:var(--panel2); color:var(--accent2); border:1px solid var(--accent2)}
  .btn:disabled{opacity:.4; cursor:not-allowed}
  .status-bar{
    font-size:12px; color:var(--muted);
  }
  .results{padding:0 20px 60px}
  .summary-pills{
    display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;
  }
  .pill{
    padding:6px 14px; border-radius:20px; font-size:12px; font-weight:600;
    background:var(--panel2); border:1px solid var(--border);
    transition:border-color .15s, color .15s;
  }
  .pill:hover{border-color:var(--accent); color:var(--accent)}
  .pill.red{border-color:var(--danger); color:var(--danger)}
  .pill.yellow{border-color:var(--accent); color:var(--accent)}
  .pill.green{border-color:var(--accent2); color:var(--accent2)}
  .search-bar{
    width:100%; padding:9px 14px; border-radius:8px;
    background:var(--panel2); border:1px solid var(--border);
    color:var(--text); font-size:13px; font-family:inherit;
    margin-bottom:12px; direction:rtl;
  }
  .search-bar:focus{outline:none; border-color:var(--accent)}
  table{width:100%; border-collapse:collapse; font-size:12.5px}
  th{
    background:var(--panel2); color:var(--muted); font-size:11px;
    font-weight:600; padding:9px 12px; text-align:right;
    border-bottom:1px solid var(--border); position:sticky; top:49px; z-index:2;
  }
  td{padding:9px 12px; border-bottom:1px solid #1a1e28; vertical-align:middle}
  tr:hover td{background:#1a1e28}
  .sect-badge{
    display:inline-block; padding:2px 8px; border-radius:5px;
    font-size:10.5px; font-weight:700; background:var(--panel2);
    border:1px solid var(--border); color:var(--muted);
  }
  .loading{padding:60px; text-align:center; color:var(--muted)}
  ::-webkit-scrollbar{width:8px; height:8px}
  .status-select{
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:4px 8px; font-size:11.5px; font-family:inherit;
    cursor:pointer; direction:rtl; max-width:130px;
  }
  .status-select:focus{outline:none; border-color:var(--accent)}
  .status-select.s1{border-color:#6c9fd9; color:#6c9fd9}
  .status-select.s2{border-color:var(--danger); color:var(--danger)}
  .status-select.s3{border-color:var(--muted); color:var(--muted)}
  .status-select.s4{border-color:var(--accent2); color:var(--accent2)}
  .status-select.s5{border-color:var(--accent); color:var(--accent)}
  .notes-input{
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:4px 8px; font-size:11px; font-family:inherit;
    width:140px; direction:rtl;
  }
  .notes-input:focus{outline:none; border-color:var(--accent)}
  ::-webkit-scrollbar-thumb{background:#2b3040; border-radius:6px}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

<header>
  <h1><span class="dot" ondblclick="window.location='index.html'" style="cursor:default"></span> לא חידשו מנוי</h1>
</header>

<div class="upload-area">
  <div class="upload-box" id="lastBox" onclick="document.getElementById('lastFile').click()">
    <div class="icon">📂</div>
    <div class="label">עונה קודמת</div>
    <div class="sub">ייצוא כרטיסי מנוי מהעונה הקודמת</div>
    <div class="count" id="lastCount"></div>
    <input type="file" id="lastFile" accept=".csv,.xlsx,.xls" onchange="handleFile('last', this)">
  </div>
  <div class="upload-box" id="currBox" onclick="document.getElementById('currFile').click()">
    <div class="icon">📂</div>
    <div class="label">עונה נוכחית</div>
    <div class="sub">ייצוא כרטיסי מנוי מהעונה הנוכחית</div>
    <div class="count" id="currCount"></div>
    <input type="file" id="currFile" accept=".csv,.xlsx,.xls" onchange="handleFile('curr', this)">
  </div>
  <div class="upload-box" id="tagBox" onclick="document.getElementById('tagFile').click()">
    <div class="icon">🏷️</div>
    <div class="label">לקוחות שחידשו</div>
    <div class="sub">רשימת לקוחות עם תג חידוש</div>
    <div class="count" id="tagCount"></div>
    <input type="file" id="tagFile" accept=".csv,.xlsx,.xls" onchange="handleFile('tag', this)">
  </div>
</div>

<div class="controls">
  <button class="btn btn-primary" id="compareBtn" onclick="compare()" disabled>השווה ➜</button>
  <button class="btn btn-export" id="exportBtn" onclick="exportCsv()" style="display:none">ייצא CSV</button>
  <span class="status-bar" id="statusBar"></span>
</div>

<div class="results" id="results"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// Firebase
firebase.initializeApp({
  apiKey:"AIzaSyCUSlbN3FKmi2h8grZo6ciZOkAS9LfVcQw",
  authDomain:"fcmn-renewals-26-27.firebaseapp.com",
  projectId:"fcmn-renewals-26-27"
});
const db = firebase.firestore();

var lastData = null, currData = null, tagData = null, notRenewed = [];

// Load last results from Firestore on page load
db.collection('meta').doc('notRenewedList').get().then(function(snap) {
  if (!snap.exists) return;
  var d = snap.data();
  if (!d.list || !d.list.length) return;
  notRenewed = d.list.map(function(r) {
    return {
      name: r.name || '',
      email: r.email || '',
      customerId: r.customerId || '',
      phone: r.phone || '',
      section: r.section || '',
      row: r.row || '',
      seat: r.seat || '',
      status: r.status || '',
      notes: r.notes || ''
    };
  });
  var updatedAt = d.updatedAt ? new Date(d.updatedAt).toLocaleString('he-IL', {timeZone:'Asia/Jerusalem',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
  document.getElementById('statusBar').textContent = notRenewed.length + ' לא חידשו' + (updatedAt ? ' · עודכן ' + updatedAt : '');
  document.getElementById('exportBtn').style.display = '';
  renderResults();
}).catch(function(e){ console.warn('Could not load notRenewedList:', e); });

function handleFile(which, input) {
  var file = input.files[0];
  if (!file) return;
  var ext = file.name.split('.').pop().toLowerCase();
  if (ext === 'csv') {
    Papa.parse(file, {
      header: true, skipEmptyLines: true,
      complete: function(r) { processData(which, r.data); }
    });
  } else {
    var reader = new FileReader();
    reader.onload = function(e) {
      var wb = XLSX.read(e.target.result, {type:'array'});
      var ws = wb.Sheets[wb.SheetNames[0]];
      var data = XLSX.utils.sheet_to_json(ws, {defval:''});
      processData(which, data);
    };
    reader.readAsArrayBuffer(file);
  }
}

function processData(which, rows) {
  // Filter: VALID season tickets, exclude transfers/rebookings
  var filtered = rows.filter(function(r) {
    var status = String(r['status']||'').toUpperCase();
    var origin = String(r['origin']||'').toLowerCase();
    var ticketName = String(r['ticketName']||r['ticket.name']||'');
    if (status !== 'VALID') return false;
    if (origin === 'transfer') return false;
    return true;
  });

  if (which === 'last') {
    lastData = filtered;
    document.getElementById('lastBox').classList.add('loaded');
    document.getElementById('lastCount').textContent = filtered.length + ' כרטיסים';
  } else if (which === 'curr') {
    currData = filtered;
    document.getElementById('currBox').classList.add('loaded');
    document.getElementById('currCount').textContent = filtered.length + ' כרטיסים';
  } else if (which === 'tag') {
    // Customers file - no VALID/origin filter needed, use raw rows
    tagData = rows;
    document.getElementById('tagBox').classList.add('loaded');
    document.getElementById('tagCount').textContent = rows.length + ' לקוחות';
  }

  if (lastData && currData) {
    document.getElementById('compareBtn').disabled = false;
  }
}

function normalize(s) { return String(s||'').trim().toLowerCase(); }

function compare() {
  document.getElementById('statusBar').textContent = 'מחשב...';
  notRenewed = [];

  // Build lookup of current season by customerId and email
  var currByCustomerId = {};
  var currByEmail = {};
  currData.forEach(function(r) {
    var cid = normalize(r['customerId']);
    var email = normalize(r['email']);
    if (cid) currByCustomerId[cid] = true;
    if (email) currByEmail[email] = true;
  });

  // Build lookup from tagged customers file (id = customerId)
  var tagByCustomerId = {};
  var tagByEmail = {};
  if (tagData) {
    tagData.forEach(function(r) {
      var cid = normalize(r['id']);
      var email = normalize(r['primaryEmail'] || r['email']);
      if (cid) tagByCustomerId[cid] = true;
      if (email) tagByEmail[email] = true;
    });
  }

  // Find last season customers not in current season
  var seenCid = {}, seenEmail = {};
  lastData.forEach(function(r) {
    var cid = normalize(r['customerId']);
    var email = normalize(r['email']);
    var name = String(r['name']||r['customer.name']||'').trim();
    var section = String(r['seat.section']||'').trim();
    var row = String(r['seat.row']||'').trim();
    var seat = String(r['seat.seat']||'').trim();

    // Skip east stand, VIP and non-seated
    var VIP_SECTIONS = ['PLATINUM','R1','R2','R3','R4','R5','R6','R7','R8','L1','L2','L3','L4','L5','L6','L7','L8'];
    if (section.includes('מזרחי') || !section || VIP_SECTIONS.includes(section.toUpperCase())) return;

    var renewed = false;
    if (cid && currByCustomerId[cid]) renewed = true;
    if (!renewed && email && currByEmail[email]) renewed = true;
    if (!renewed && cid && tagByCustomerId[cid]) renewed = true;
    if (!renewed && email && tagByEmail[email]) renewed = true;

    // Deduplicate by customerId, fallback by email
    if (!renewed) {
      if (cid && seenCid[cid]) return;
      if (!cid && email && seenEmail[email]) return;
      if (cid) seenCid[cid] = true;
      if (email) seenEmail[email] = true;
      // Preserve existing status/notes if customer was already in list
      var existing = notRenewed.find(function(e){ return e.customerId && e.customerId === String(r['customerId']||'').trim(); });
      notRenewed.push({
        name: name,
        email: String(r['email']||'').trim(),
        customerId: String(r['customerId']||'').trim(),
        phone: String(r['customer.phone']||'').trim(),
        section: section,
        row: row,
        seat: seat,
        status: existing ? existing.status||'' : '',
        notes: existing ? existing.notes||'' : '',
      });
    }
  });

  // Sort by section, row, seat
  notRenewed.sort(function(a,b) {
    if (a.section !== b.section) return a.section.localeCompare(b.section);
    if (a.row !== b.row) return parseInt(a.row||0) - parseInt(b.row||0);
    return parseInt(a.seat||0) - parseInt(b.seat||0);
  });

  renderResults();
  document.getElementById('statusBar').textContent = notRenewed.length + ' לא חידשו';
  // Write count + full list to Firestore
  var listForFirestore = notRenewed.map(function(r) {
    return { customerId: r.customerId, email: r.email, name: r.name, section: r.section, row: r.row, seat: r.seat, phone: r.phone, status: r.status||'', notes: r.notes||'' };
  });
  db.collection('meta').doc('stats').update({
    notRenewedCount: notRenewed.length,
    notRenewedUpdated: new Date().toISOString()
  }).catch(function(e){ console.warn('Firestore stats update failed:', e); });
  db.collection('meta').doc('notRenewedList').set({
    list: listForFirestore,
    updatedAt: new Date().toISOString()
  }).catch(function(e){ console.warn('Firestore list update failed:', e); });
  document.getElementById('exportBtn').style.display = '';
}

var STATUS_COLORS = {'לא מעוניין':'s1','לא עונה':'s2','חידש':'s3','אחר':'s4'};

function updateField(key, field, value, el) {
  // Update in local notRenewed array
  var entry = notRenewed.find(function(r){ return (r.customerId && r.customerId === key) || (r.email && r.email === key); });
  if (!entry) return;
  entry[field] = value;
  // Update color class on select
  if (field === 'status' && el) {
    el.className = 'status-select ' + (STATUS_COLORS[value] || '');
  }
  // Debounced Firestore write
  clearTimeout(entry._saveTimer);
  entry._saveTimer = setTimeout(function() {
    var list = notRenewed.map(function(r) {
      return { customerId: r.customerId||'', email: r.email||'', name: r.name||'', section: r.section||'', row: r.row||'', seat: r.seat||'', phone: r.phone||'', status: r.status||'', notes: r.notes||'' };
    });
    db.collection('meta').doc('notRenewedList').update({ list: list })
      .catch(function(e){ console.warn('Save failed:', e); });
  }, 800);
}

var activeSectionFilter = '';
var statusFilter = '';

var filtered = [];
function renderResults(sectionClick) {
  if (sectionClick !== undefined) {
    activeSectionFilter = (activeSectionFilter === sectionClick) ? '' : sectionClick;
  }
  var q = (document.getElementById('searchInput')||{}).value || '';
  q = q.trim().toLowerCase();
  filtered = notRenewed.filter(function(r) {
    if (activeSectionFilter && r.section !== activeSectionFilter) return false;
    if (statusFilter === 'with' && !r.status) return false;
    if (statusFilter === 'without' && r.status) return false;
    if (!q) return true;
    return r.name.toLowerCase().includes(q) ||
           r.email.toLowerCase().includes(q) ||
           r.section.toLowerCase().includes(q) ||
           r.phone.includes(q);
  });

  // Group by section for summary
  var bySec = {};
  notRenewed.forEach(function(r) { bySec[r.section] = (bySec[r.section]||0)+1; });
  var secList = Object.keys(bySec).sort();

  var html = '<div class="summary-pills">';
  html += '<span class="pill red" style="cursor:pointer" onclick="activeSectionFilter=\'\';renderResults()">לא חידשו: ' + notRenewed.length + '</span>';
  html += '<span class="pill yellow">מוצגים: ' + filtered.length + '</span>';
  secList.forEach(function(s) {
    var active = activeSectionFilter === s;
    html += '<span class="pill" style="cursor:pointer;' + (active ? 'border-color:var(--accent);color:var(--accent);background:var(--panel2)' : '') + '" onclick="renderResults(\'' + s + '\')">' + s + ': ' + bySec[s] + '</span>';
  });
  html += '</div>';
  // Status filter buttons
  var totalWithStatus = notRenewed.filter(function(r){ return r.status && r.section; }).length;
  var totalNoStatus = notRenewed.filter(function(r){ return !r.status; }).length;
  html += '<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">';
  html += '<span class="pill" style="cursor:pointer;' + (statusFilter==='with' ? 'border-color:var(--accent2);color:var(--accent2)' : '') + '" onclick="statusFilter=(statusFilter===\'with\'?\'\':\'with\');renderResults()">עם סטטוס: ' + totalWithStatus + '</span>';
  html += '<span class="pill" style="cursor:pointer;' + (statusFilter==='without' ? 'border-color:var(--accent);color:var(--accent)' : '') + '" onclick="statusFilter=(statusFilter===\'without\'?\'\':\'without\');renderResults()">ללא סטטוס: ' + totalNoStatus + '</span>';
  html += '</div>';

  html += '<input class="search-bar" id="searchInput" placeholder="חיפוש לפי שם / אימייל / יציע..." oninput="renderResults(undefined)" value="' + (q||'') + '">';

  if (filtered.length === 0) {
    html += '<div class="loading">לא נמצאו תוצאות</div>';
  } else {
    html += '<table><thead><tr>';
    html += '<th>#</th><th>שם</th><th>אימייל</th><th>טלפון</th><th>יציע</th><th>שורה</th><th>מושב</th><th>סטטוס</th><th>הערות</th>';
    html += '</tr></thead><tbody>';
    filtered.forEach(function(r, i) {
      var rowStyle = (r.status === 'לא מעוניין') ? ' style="background:#2a1515"' : '';
      html += '<tr' + rowStyle + '>';
      html += '<td style="color:var(--muted)">' + (i+1) + '</td>';
      html += '<td><b>' + esc(r.name) + '</b></td>';
      html += '<td style="color:var(--muted);font-size:11px">' + esc(r.email) + '</td>';
      html += '<td style="color:var(--muted);font-size:11px">' + esc(r.phone) + '</td>';
      html += '<td><span class="sect-badge">' + esc(r.section) + '</span></td>';
      html += '<td>' + esc(r.row) + '</td>';
      html += '<td>' + esc(r.seat) + '</td>';
      var statusValues = ['לא מעוניין','לא עונה','חידש','אחר'];
      var statusColors = {'לא מעוניין':'s1','לא עונה':'s2','חידש':'s3','אחר':'s4'};
      var statusClass = statusColors[r.status||''] || '';
      var cidKey = esc(r.customerId || r.email);
      var selectHtml = '<select class="status-select ' + statusClass + '" onchange="updateField(\''+cidKey+'\', \'status\', this.value, this)">';
      selectHtml += '<option value="">—</option>';
      statusValues.forEach(function(sv) {
        selectHtml += '<option value="' + sv + '"' + (r.status===sv ? ' selected' : '') + '>' + sv + '</option>';
      });
      selectHtml += '</select>';
      html += '<td>' + selectHtml + '</td>';
      html += '<td><input class="notes-input" type="text" placeholder="הערה..." value="' + esc(r.notes||'') + '" onchange="updateField(\''+cidKey+'\', \'notes\', this.value, null)"></td>';
      html += '</tr>';
    });
    html += '</tbody></table>';
  }

  document.getElementById('results').innerHTML = html;
}

function esc(s) {
  return String(s||'').replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function exportCsv() {
  var rows = [['שם','אימייל','טלפון','customerId','יציע','שורה','מושב']];
  notRenewed.forEach(function(r) {
    rows.push([r.name, r.email, r.phone, r.customerId, r.section, r.row, r.seat]);
  });
  var csv = rows.map(function(r) {
    return r.map(function(v) { return '"' + String(v).replace(/"/g,'""') + '"'; }).join(',');
  }).join('\n');
  var bom = '\uFEFF';
  var blob = new Blob([bom+csv], {type:'text/csv;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'not-renewed.csv';
  a.click();
}

// Drag and drop support
['lastBox','currBox','tagBox'].forEach(function(id) {
  var box = document.getElementById(id);
  var which = id === 'lastBox' ? 'last' : id === 'currBox' ? 'curr' : 'tag';
  var input = document.getElementById(which === 'last' ? 'lastFile' : which === 'curr' ? 'currFile' : 'tagFile');
  box.addEventListener('dragover', function(e) { e.preventDefault(); box.classList.add('dragover'); });
  box.addEventListener('dragleave', function() { box.classList.remove('dragover'); });
  box.addEventListener('drop', function(e) {
    e.preventDefault(); box.classList.remove('dragover');
    var file = e.dataTransfer.files[0];
    if (file) { input.files = e.dataTransfer.files; handleFile(which, input); }
  });
});
</script>
</body>
</html>

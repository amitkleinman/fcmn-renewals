<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>מפת מושבים VIP</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1f2330; --border:#2b3040;
    --text:#e8eaf0; --muted:#9aa3b5; --accent:#f5c518; --accent2:#2dd4a3;
    --danger:#ef5b5b;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh;
  }
  header{
    position:sticky; top:0; z-index:5; background:linear-gradient(180deg,#14161c,#14161cee);
    backdrop-filter:blur(6px); padding:16px 20px; border-bottom:1px solid var(--border);
  }
  h1{margin:0 0 4px; font-size:19px; display:flex; align-items:center; gap:10px}
  h1 .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .subtitle{font-size:12.5px; color:var(--muted)}

  .tabs{
    display:flex; gap:6px; flex-wrap:wrap; padding:12px 20px 0;
  }
  .tab{
    flex:0 0 auto; padding:9px 16px; border-radius:9px; cursor:pointer;
    background:var(--panel); border:1px solid var(--border);
    color:var(--muted); font-size:13.5px; white-space:nowrap;
  }
  .tab:hover{color:var(--text); border-color:#3b4255}
  .tab.active{
    background:var(--panel2); color:var(--text); border-color:var(--accent);
    box-shadow:0 0 0 1px var(--accent) inset;
  }

  main{padding:16px 20px 60px}
  .section-panel{
    border:1px solid var(--border); border-radius:12px; overflow:hidden; background:var(--panel);
  }
  .map-stats{font-size:12.5px; color:var(--muted); padding:14px 16px 4px; display:flex; gap:16px; flex-wrap:wrap}
  .map-legend{font-size:11px; color:var(--muted); padding:6px 16px 14px; display:flex; gap:14px; flex-wrap:wrap}
  .map-legend span{display:flex; align-items:center; gap:5px}
  .map-legend .lb{width:12px;height:12px;border-radius:3px}
  .seat-map{padding:8px 16px 20px; overflow-x:auto}
  .map-row{display:flex; align-items:center; gap:4px; margin-bottom:4px}
  .map-row-label{width:34px; text-align:center; font-size:10px; color:var(--muted); flex-shrink:0}
  .map-seat{
    width:30px; height:30px; border-radius:6px; border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-size:9px; color:var(--muted); position:relative;
    background:var(--panel2); flex-shrink:0;
  }
  .map-seat.taken{background:#16332a; border-color:var(--accent2); color:var(--accent2)}
  .map-seat.empty-seat{background:var(--panel); border-color:#2b3040; color:#3a4055}
  .map-seat.no-seat{
    background:repeating-linear-gradient(45deg, #1a1d26, #1a1d26 4px, #24283566 4px, #24283566 8px);
    border-color:#20242f; pointer-events:none;
  }
  .map-seat .stip{
    display:none; position:absolute; top:calc(100% + 4px); right:50%; transform:translateX(50%);
    background:#22273a; border:1px solid var(--border); border-radius:6px;
    padding:5px 8px; font-size:10px; color:var(--text); white-space:nowrap; z-index:200;
    pointer-events:none;
  }
  .map-seat.taken:hover .stip{display:block}
  .loading{padding:60px; text-align:center; color:var(--muted)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#2b3040;border-radius:6px}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

</head>

let activeSection = 'PLATINUM';

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderTabs(){
  const el = document.getElementById('tabs');
  el.innerHTML = '';
  for(const section of SECTIONS){
    if(!MAP_DATA[section]) continue;
    const tab = document.createElement('div');
    tab.className = 'tab' + (section===activeSection ? ' active' : '');
    tab.textContent = SECTION_LABELS[section] || section;
    tab.addEventListener('click', ()=>{
      activeSection = section;
      renderTabs();
      renderMap(section);
    });
    el.appendChild(tab);
  }
}

function renderMap(section){
  const main = document.getElementById('main');
  main.innerHTML = '';
  const data = MAP_DATA[section];
  if(!data){ main.innerHTML = '<div class="loading">אין נתונים לעמדה זו</div>'; return; }

  const seatMap = new Map();
  data.seats.forEach(s => seatMap.set(`${s.row}|${s.seat}`, s));

  const panel = document.createElement('div');
  panel.className = 'section-panel';

  const total = SEATS[section] || data.seats.length;
  const taken = data.seats.filter(s => liveStatus[section+'|'+s.row+'|'+s.seat]).length;
  const empty = total - taken;

  const statsDiv = document.createElement('div');
  statsDiv.className = 'map-stats';
  statsDiv.innerHTML = `
    <span><b>${total}</b> מקומות</span>
    <span>תפוסים: <b style="color:var(--accent2)">${taken}</b></span>
    <span>פנויים: <b style="color:var(--muted)">${empty}</b></span>
  `;
  panel.appendChild(statsDiv);

  const legend = document.createElement('div');
  legend.className = 'map-legend';
  legend.innerHTML = `
    <span><span class="lb" style="background:#16332a;border:1px solid var(--accent2)"></span> תפוס (ריחוף להצגת שם)</span>
    <span><span class="lb" style="background:var(--panel);border:1px solid #2b3040"></span> פנוי</span>
    <span><span class="lb" style="background:repeating-linear-gradient(45deg,#1a1d26,#1a1d26 3px,#242835 3px,#242835 6px);border:1px solid #20242f"></span> אין מושב</span>
  `;
  panel.appendChild(legend);

  const mapDiv = document.createElement('div');
  mapDiv.className = 'seat-map';

  data.rows.slice().reverse().forEach(rowNum=>{
    const seatsInRow = data.seats.filter(s=>s.row===rowNum);
    if(seatsInRow.length===0) return;
    const rowSeatNums = new Set(seatsInRow.map(s=>s.seat));

    const rowDiv = document.createElement('div');
    rowDiv.className = 'map-row';
    const label = document.createElement('div');
    label.className = 'map-row-label';
    label.textContent = `ש׳ ${rowNum}`;
    rowDiv.appendChild(label);

    const seatOrder = data.all_seats.slice().reverse();
    seatOrder.forEach(s=>{
      const cell = document.createElement('div');
      if(!rowSeatNums.has(s)){
        cell.className = 'map-seat no-seat';
      } else {
        const liveKey = section + '|' + rowNum + '|' + s;
        const liveEntry = liveStatus[liveKey];
        if(liveEntry){
          cell.className = 'map-seat taken';
          cell.textContent = s;
          const tip = document.createElement('div');
          tip.className = 'stip';
          tip.textContent = (liveEntry.name || 'מנוי') + ' · שורה ' + rowNum + ' · מושב ' + s;
          cell.appendChild(tip);
        } else {
          cell.className = 'map-seat empty-seat';
          cell.textContent = s;
        }
      }
      rowDiv.appendChild(cell);
    });
    mapDiv.appendChild(rowDiv);
  });

  panel.appendChild(mapDiv);
  main.appendChild(panel);
}

// Live seatStatus from Firestore
let liveStatus = {}; // key: "SECTION|row|seat" -> {name}

db.collection('meta').doc('seatStatus').onSnapshot(function(snap) {
  liveStatus = {};
  if (snap.exists) {
    var data = snap.data();
    Object.keys(data).forEach(function(key) {
      var val = data[key];
      liveStatus[key] = { name: val.name || '' };
    });
  }
  renderTabs();
  renderMap(activeSection);
  document.querySelector('.subtitle').textContent = 'עדכון חי ● ' + new Date().toLocaleTimeString('he-IL', {hour:'2-digit',minute:'2-digit'});

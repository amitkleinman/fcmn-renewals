<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>זמינות כרטיסים - מכבי נתניה</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--panel2:#1f2330;--border:#2b3040;--text:#e8eaf0;--muted:#9aa3b5;--accent:#f5c518;--accent2:#2dd4a3;--danger:#ef5b5b;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"Segoe UI",Arial,sans-serif;min-height:100vh;padding:20px}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
  h1{font-size:20px;display:flex;align-items:center;gap:10px}
  h1 .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .back-link{color:var(--muted);text-decoration:none;font-size:13px;border:1px solid var(--border);padding:6px 12px;border-radius:7px}
  .controls{display:flex;gap:12px;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap}
  .ctrl-group{display:flex;flex-direction:column;gap:5px}
  .ctrl-group label{font-size:12px;color:var(--muted)}
  .ctrl-group input{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:7px;font-size:13px;min-width:280px}
  .btn{padding:9px 18px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;border:none;background:var(--accent);color:#14161c}
  .summary-bar{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:20px;padding:12px 16px;background:var(--panel);border:1px solid var(--border);border-radius:10px}
  .summary-bar b{color:var(--text)}
  .status{font-size:12px;color:var(--muted);margin-bottom:12px}
  .live{color:var(--accent2)}
  table{border-collapse:collapse;width:100%}
  th,td{padding:10px 14px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
  th{background:var(--panel2);color:var(--muted);font-size:12px;font-weight:600}
  td.sn{text-align:right;font-weight:600;color:var(--text)}
  td.season{color:#6c9fd9}
  td.game{color:var(--accent2)}
  td.remain{font-weight:700}
  td.low{color:var(--danger)}
  td.med{color:var(--accent)}
  td.ok{color:var(--accent2)}
  .pb{display:inline-block;height:8px;border-radius:4px;background:#2b3040;width:70px;vertical-align:middle;margin-right:6px;position:relative}
  .pbf{position:absolute;top:0;left:0;height:100%;border-radius:4px;background:var(--accent2)}
  .pbf.low{background:var(--danger)}.pbf.med{background:var(--accent)}
  tr:hover td{background:#1c2030}
  .gh td{background:#1a2a1a;color:var(--accent);font-size:11px;font-weight:700;text-align:right;padding:6px 14px}
  tfoot td{background:var(--panel2);font-weight:700;border-top:2px solid var(--accent)}
</style>
</head>
<body>
<header>
  <h1><span class="dot"></span> 🎟️ זמינות כרטיסים <span style="font-size:11px;color:var(--muted);font-weight:400">(v2.7)</span></h1>
  <a href="index.html" class="back-link">← חזור לטרקר</a>
</header>

<div class="controls">
  <div class="ctrl-group">
    <label>Event ID משחק (Vivenu) — אופציונלי</label>
    <input type="text" id="eventId" placeholder="6a5cc8376d616cab8463a42c">
  </div>
  <button class="btn" id="loadBtn">טען משחק</button>
  <button class="btn" id="endGameBtn" style="background:var(--danger);color:#fff">סיים משחק ✕</button>
  <span id="eventLabel" style="font-size:12px;color:var(--accent2)"></span>
</div>

<div class="status" id="statusEl">טוען...</div>
<div class="status" id="gameStatusEl" style="color:var(--accent2)"></div>
<div class="summary-bar" id="summaryBar" style="display:none"></div>
<div class="summary-bar" id="totalsBar" style="display:none;border-top:1px solid var(--border);margin-top:-12px;border-radius:0 0 10px 10px;font-size:13px"></div>

<div style="overflow-x:auto">
<table>
  <thead>
    <tr>
      <th style="text-align:right">יציע</th>
      <th>קיבולת</th>
      <th style="color:#6c9fd9">מנויים</th>
      <th style="color:var(--accent2)">משחק בתשלום</th>
      <th style="color:#a78bfa">משחק חינם ✦</th>
      <th style="color:var(--muted)">נגיש ♿</th>
      <th style="color:var(--accent)">שמור ✏️</th>
      <th style="color:var(--muted)">הערה</th>
      <th>תפוס</th>
      <th>נותר</th>
      <th>ניצול</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
  <tfoot id="tableFoot"></tfoot>
</table>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyCUSlbN3FKmi2h8grZo6ciZOkAS9LfVcQw",authDomain:"fcmn-renewals-26-27.firebaseapp.com",projectId:"fcmn-renewals-26-27",storageBucket:"fcmn-renewals-26-27.firebasestorage.app",messagingSenderId:"681981226078",appId:"1:681981226078:web:9db5a9aedee0c56193d8cf"});
const db = firebase.firestore();

const VIP_SECTIONS = new Set(['PLATINUM','R1','R2','R3','R4','R5','R6','R7','R8','R9','L1','L2','L3','L4','L5','L6','L7','L8','L9','BOX']);

let kosherCount = 0;
let vipCount = 0;

// Load kosher from stats
db.collection('meta').doc('stats').onSnapshot(function(snap) {
  if (snap.exists) kosherCount = snap.data().kasherCount || 0;
  renderTotalsBar();
});

const ACCESSIBLE = {
  '103L': 16,
  '107': 16
};

let savedCounts = {}; // loaded from Firestore meta/savedSeats, editable
let savedComments = {}; // section → comment string

const SEATS = {
  '101':202,'102':389,'103L':258,'103R':68,'104':118,
  '105C':289,'105L':190,'105R':190,'106':117,'107':324,
  '108':389,'109':207,'201':220,'202':331,'203L':218,'203R':202,
  '204':462,'205':238,'206L':256,'206R':182,'207':439,'208':332,'209':222
};

const GROUPS = [
  { label: 'מערבי תחתון הושבה (101-104)', sections: ['101','102','103R','103L','104'] },
  { label: 'כסף (105)', sections: ['105R','105L','105C'] },
  { label: 'מערבי תחתון ללא הושבה (106-109)', sections: ['106','107','108','109'] },
  { label: 'מערבי עליון הושבה (201-206R)', sections: ['201','202','203R','203L','204','205','206R'] },
  { label: 'מערבי עליון ללא הושבה (206L-209)', sections: ['206L','207','208','209'] }
];

let seasonCounts = {};
let gameCounts = {};
let seatUnsub = null;
let gameUnsub = null;

// Load active game from Firestore
db.collection('meta').doc('activeGame').onSnapshot(function(snap) {
  var savedEventId = snap.exists ? (snap.data().eventId || '') : '';
  var input = document.getElementById('eventId');
  if (savedEventId && input.value !== savedEventId) {
    input.value = savedEventId;
    loadGame(savedEventId);
    db.collection('gamesConfig').where('eventId','==',savedEventId).get().then(function(q) {
      var name = savedEventId;
      if (!q.empty) {
        var d = q.docs[0].data();
        name = (d.name || '') + (d.opponent ? ' נגד ' + d.opponent : '');
      }
      document.getElementById('eventLabel').textContent = name + ' — פעיל ●';
      document.getElementById('gameStatusEl').innerHTML = '<span style="color:var(--accent)">' + name + '</span> — עדכון חי <span class="live">●</span>';
    document.getElementById('gameStatusEl').innerHTML = '<span style="color:var(--accent)">' + name + '</span> — עדכון חי <span class="live">●</span>';
    });
  }
});

// Load saved seats from Firestore
db.collection('meta').doc('savedSeats').onSnapshot(function(snap) {
  savedCounts = {};
  savedComments = {};
  if (snap.exists) {
    var data = snap.data();
    Object.keys(data).forEach(function(key) {
      if (key.endsWith('_comment')) {
        savedComments[key.replace('_comment','')] = data[key];
      } else {
        savedCounts[key] = data[key];
      }
    });
  }
  render();
});

function renderTotalsBar() {
  var bar = document.getElementById('totalsBar');
  var regularSeason = Object.values(seasonCounts).reduce(function(a,b){return a+b;},0);
  var total = regularSeason + vipCount + kosherCount;
  bar.style.display = 'flex';
  bar.innerHTML =
    '<span>מנויים רגילים: <b style="color:#6c9fd9">' + regularSeason.toLocaleString() + '</b></span>' +
    '<span>VIP/Platinum: <b style="color:#a78bfa">' + vipCount.toLocaleString() + '</b></span>' +
    '<span>כשר: <b style="color:var(--accent2)">' + kosherCount.toLocaleString() + '</b></span>' +
    '<span style="border-right:1px solid var(--border);padding-right:16px">סה"כ מנויים: <b style="color:var(--accent);font-size:15px">' + total.toLocaleString() + '</b></span>' +
    '<span style="color:var(--muted);font-size:11px">← אמור להתאים לטרקר</span>';
}

function showGameFreeList(section) {
  var rawList = gameCounts[section + '_freeNames'];
  var list = [];
  if (rawList && rawList.arrayValue) {
    list = (rawList.arrayValue.values || []).map(function(v) {
      var f = (v.mapValue && v.mapValue.fields) || {};
      return { name: (f.name && f.name.stringValue) || '', email: (f.email && f.email.stringValue) || '' };
    });
  } else if (Array.isArray(rawList)) { list = rawList; }
  var count = gameCounts[section + '_free'] || 0;
  if (!count) return;
  var overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:#0009;z-index:1000;display:flex;align-items:center;justify-content:center';
  var box = document.createElement('div');
  box.style.cssText = 'background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;min-width:360px;max-width:480px;max-height:80vh;overflow-y:auto;direction:rtl';
  var titleDiv = document.createElement('div');
  titleDiv.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:14px';
  var tb = document.createElement('b');
  tb.textContent = 'כרטיסי חינם — יציע ' + section + ' (' + count + ')';
  tb.style.fontSize = '15px';
  var cb = document.createElement('button');
  cb.textContent = '✕'; cb.style.cssText = 'background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer';
  cb.onclick = function() { overlay.remove(); };
  titleDiv.appendChild(tb); titleDiv.appendChild(cb); box.appendChild(titleDiv);
  if (list.length > 0) {
    var hdr = document.createElement('div');
    hdr.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:11px;color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--border);margin-bottom:6px';
    hdr.innerHTML = '<span>שם</span><span>אימייל</span>';
    box.appendChild(hdr);
    list.forEach(function(item, i) {
      var row = document.createElement('div');
      row.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:5px 0;border-bottom:1px solid #20242f;font-size:12px';
      row.innerHTML = '<span>' + (i+1) + '. ' + (item.name||'—') + '</span><span style="color:var(--muted);font-size:10px">' + (item.email||'—') + '</span>';
      box.appendChild(row);
    });
  } else {
    var msg = document.createElement('div');
    msg.textContent = 'רשימה תתעדכן עם קבלת webhook';
    msg.style.cssText = 'color:var(--muted);font-size:13px;text-align:center;padding:20px';
    box.appendChild(msg);
  }
  overlay.appendChild(box); document.body.appendChild(overlay);
  overlay.addEventListener('click', function(e) { if(e.target===overlay) overlay.remove(); });
}

function loadSeason() {
  if (seatUnsub) seatUnsub();
  seatUnsub = db.collection('meta').doc('seatStatus').onSnapshot(function(snap) {
    seasonCounts = {};
    if (snap.exists) {
      var data = snap.data();
      vipCount = 0;
      Object.keys(data).forEach(function(key) {
        var section = key.split('|')[0];
        if (VIP_SECTIONS.has(section)) { vipCount++; return; }
        seasonCounts[section] = (seasonCounts[section] || 0) + 1;
      });
    }
    render();
    renderTotalsBar();
    document.getElementById('statusEl').innerHTML = 'מנויים: עדכון חי <span class="live">●</span>';
  });
}

function loadGame(eventId) {
  if (gameUnsub) gameUnsub();
  gameCounts = {};
  if (!eventId) { render(); return; }
  gameUnsub = db.collection('gameSeating').doc(eventId).onSnapshot(function(snap) {
    gameCounts = snap.exists ? snap.data() : {};
    render();
    document.getElementById('eventLabel').textContent = 'עדכון חי ●';
  });
}

function render() {
  var tbody = document.getElementById('tableBody');
  var tfoot = document.getElementById('tableFoot');
  var summaryBar = document.getElementById('summaryBar');
  var rows = '';
  var totCap=0, totSeason=0, totGame=0;

  GROUPS.forEach(function(group) {
    rows += '<tr class="gh"><td colspan="11">' + group.label + '</td></tr>';
    var gCap=0,gSeason=0,gGame=0,gGamePaid=0,gGameFree=0,gAcc=0,gSaved=0;
    group.sections.forEach(function(s) {
      var cap = SEATS[s] || 0;
      var accessible = ACCESSIBLE[s] || 0;
      var saved = savedCounts[s] || 0;
      var season = seasonCounts[s] || 0;
      var gamePaid = gameCounts[s + '_paid'] || 0;
      var gameFree = gameCounts[s + '_free'] || 0;
      var game = gamePaid + gameFree;
      var taken = season + game;
      var remain = cap - taken - accessible - saved;
      var pct = cap > 0 ? Math.round((taken + accessible + saved)/cap*100) : 0;
      var cls = remain <= 20 ? 'low' : remain <= 50 ? 'med' : 'ok';
      totCap+=cap; totSeason+=season; totGame+=game;
      gCap+=cap; gSeason+=season; gGamePaid+=gamePaid; gGameFree+=gameFree; gGame+=game; gAcc+=accessible; gSaved+=saved;
      rows += '<tr>' +
        '<td class="sn">' + s + '</td>' +
        '<td style="color:var(--muted)">' + cap.toLocaleString() + '</td>' +
        '<td class="season">' + season.toLocaleString() + '</td>' +
        '<td class="game">' + (gamePaid > 0 ? gamePaid.toLocaleString() : '—') + '</td>' +
        '<td style="color:#a78bfa;cursor:pointer" onclick="showGameFreeList(&quot;' + s + '&quot;)">' + (gameFree > 0 ? gameFree.toLocaleString() + ' ✦' : '—') + '</td>' +
        '<td style="color:var(--muted)">' + (accessible > 0 ? accessible : '—') + '</td>' +
        '<td style="color:var(--accent);cursor:pointer" onclick="editSaved(&quot;' + s + '&quot;)" title="' + (savedComments[s] ? savedComments[s] : 'לחץ לעריכה') + '">' + (saved > 0 ? saved : '—') + ' ✏️</td>' +
        '<td style="color:var(--muted);font-size:11px;max-width:150px;overflow:hidden;text-overflow:ellipsis" title="' + (savedComments[s]||'') + '">' + (savedComments[s] ? savedComments[s] : '—') + '</td>' +
        '<td>' + taken.toLocaleString() + '</td>' +
        '<td class="remain ' + cls + '">' + remain.toLocaleString() + '</td>' +
        '<td><span class="pb"><span class="pbf ' + cls + '" style="width:' + pct + '%"></span></span>' + pct + '%</td>' +
        '</tr>';
    });
    // Group subtotal row
    var gTaken = gSeason+gGame;
    var gRemain = gCap-gTaken-gAcc-gSaved;
    var gPct = gCap>0?Math.round((gTaken+gAcc+gSaved)/gCap*100):0;
    var gCls = gRemain <= 20 ? 'low' : gRemain <= 50 ? 'med' : 'ok';
    rows += '<tr style="background:#1c2030;font-size:12px;font-weight:600;border-top:1px solid var(--accent)">' +
      '<td style="text-align:right;color:var(--accent)">סה"כ ' + group.label.split(' (')[0] + '</td>' +
      '<td style="color:var(--muted)">' + gCap.toLocaleString() + '</td>' +
      '<td style="color:#6c9fd9">' + gSeason.toLocaleString() + '</td>' +
      '<td style="color:var(--accent2)">' + (gGamePaid>0?gGamePaid.toLocaleString():'—') + '</td>' +
      '<td style="color:#a78bfa">' + (gGameFree>0?gGameFree.toLocaleString():'—') + '</td>' +
      '<td style="color:var(--muted)">' + (gAcc>0?gAcc:'—') + '</td>' +
      '<td style="color:var(--accent)">' + (gSaved>0?gSaved:'—') + '</td>' +
      '<td></td>' +
      '<td>' + gTaken.toLocaleString() + '</td>' +
      '<td style="color:var(--accent);font-weight:700">' + gRemain.toLocaleString() + '</td>' +
      '<td><span class="pb"><span class="pbf ' + gCls + '" style="width:' + gPct + '%"></span></span>' + gPct + '%</td>' +
      '</tr>';
  });
  tbody.innerHTML = rows;

  var totTaken = totSeason + totGame;
  var totRemain = totCap - totTaken;
  var totPct = Math.round(totTaken/totCap*100);
  var totAccessible = Object.values(ACCESSIBLE).reduce(function(a,b){return a+b;},0);
  var totSaved = Object.values(savedCounts).reduce(function(a,b){return a+b;},0);
  var totRemainFinal = totCap - totTaken - totAccessible - totSaved;
  tfoot.innerHTML = '<tr>' +
    '<td style="text-align:right">סה"כ</td>' +
    '<td>' + totCap.toLocaleString() + '</td>' +
    '<td style="color:#6c9fd9">' + totSeason.toLocaleString() + '</td>' +
    '<td style="color:var(--accent2)">—</td>' +
    '<td style="color:#a78bfa">—</td>' +
    '<td style="color:var(--muted)">' + totAccessible + '</td>' +
    '<td style="color:var(--accent)">' + totSaved + '</td>' +
    '<td></td>' +
    '<td>' + totTaken.toLocaleString() + '</td>' +
    '<td style="color:var(--accent)">' + totRemainFinal.toLocaleString() + '</td>' +
    '<td><span class="pb"><span class="pbf" style="width:' + totPct + '%;background:var(--accent2)"></span></span>' + totPct + '%</td>' +
    '</tr>';

  summaryBar.style.display = 'flex';
  summaryBar.innerHTML =
    '<span>קיבולת: <b>' + totCap.toLocaleString() + '</b></span>' +
    '<span>מנויים: <b style="color:#6c9fd9">' + totSeason.toLocaleString() + '</b></span>' +
    (totGame > 0 ? '<span>כרטיסי משחק: <b style="color:var(--accent2)">' + totGame.toLocaleString() + '</b></span>' : '') +
    '<span>נותר למכירה: <b style="color:var(--accent);font-size:15px">' + totRemain.toLocaleString() + '</b></span>' +
    '<span>ניצול: <b>' + totPct + '%</b></span>';
}

document.getElementById('loadBtn').addEventListener('click', function() {
  var eventId = document.getElementById('eventId').value.trim();
  if (!eventId) return;
  document.getElementById('eventLabel').textContent = 'שומר...';
  db.collection('meta').doc('activeGame').set({ eventId: eventId })
    .then(function() {
      loadGame(eventId);
    });
  // Fetch game name from gamesConfig
  db.collection('gamesConfig').doc(eventId).get().then(function(snap) {
    var name = snap.exists ? ((snap.data().name || '') + (snap.data().opponent ? ' נגד ' + snap.data().opponent : '')) : eventId;
    document.getElementById('eventLabel').textContent = name + ' — פעיל ●';
    document.getElementById('gameStatusEl').innerHTML = '<span style="color:var(--accent)">' + name + '</span> — עדכון חי <span class="live">●</span>';
  }).catch(function() {
    // Try querying by eventId field
    db.collection('gamesConfig').where('eventId','==',eventId).get().then(function(q) {
      var name = eventId;
      if (!q.empty) {
        var d = q.docs[0].data();
        name = (d.name || '') + (d.opponent ? ' נגד ' + d.opponent : '');
      }
      document.getElementById('eventLabel').textContent = name + ' — פעיל ●';
      document.getElementById('gameStatusEl').innerHTML = '<span style="color:var(--accent)">' + name + '</span> — עדכון חי <span class="live">●</span>';
    document.getElementById('gameStatusEl').innerHTML = '<span style="color:var(--accent)">' + name + '</span> — עדכון חי <span class="live">●</span>';
    });
  });
});

document.getElementById('endGameBtn').addEventListener('click', function() {
  if (!confirm('לסיים את המשחק ולאפס את הספירה?')) return;
  db.collection('meta').doc('activeGame').set({ eventId: '' })
    .then(function() {
      document.getElementById('eventId').value = '';
      document.getElementById('eventLabel').textContent = '';
      document.getElementById('gameStatusEl').innerHTML = '';
      if (gameUnsub) { gameUnsub(); gameUnsub = null; }
      gameCounts = {};
      render();
    });
});

loadSeason();

function editSaved(section) {
  var overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:#0009;z-index:1000;display:flex;align-items:center;justify-content:center';
  var box = document.createElement('div');
  box.style.cssText = 'background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:24px;min-width:280px;direction:rtl';
  box.innerHTML = '<b style="font-size:15px;display:block;margin-bottom:16px">יציע ' + section + ' — מושבים שמורים</b>' +
    '<label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">מספר מושבים שמורים</label>' +
    '<input id="savedNum" type="number" value="' + (savedCounts[section]||0) + '" style="width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:7px;font-size:13px;margin-bottom:10px">' +
    '<label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">הערה (סיבה)</label>' +
    '<input id="savedComment" type="text" value="' + (savedComments[section]||'') + '" placeholder="למשל: שמור לנכים, VIP..." style="width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:7px;font-size:13px;margin-bottom:14px">' +
    '<div style="display:flex;gap:8px">' +
    '<button id="saveBtn" style="flex:1;padding:9px;background:var(--accent);color:#14161c;border:none;border-radius:8px;cursor:pointer;font-weight:700">שמור</button>' +
    '<button id="cancelBtn" style="flex:1;padding:9px;background:var(--panel2);border:1px solid var(--border);color:var(--muted);border-radius:8px;cursor:pointer">ביטול</button>' +
    '</div>';
  overlay.appendChild(box); document.body.appendChild(overlay);
  overlay.addEventListener('click', function(e) { if(e.target===overlay) overlay.remove(); });
  box.querySelector('#cancelBtn').onclick = function() { overlay.remove(); };
  box.querySelector('#saveBtn').onclick = function() {
    var num = parseInt(box.querySelector('#savedNum').value) || 0;
    var comment = box.querySelector('#savedComment').value.trim();
    var update = Object.assign({}, savedCounts, savedComments ? Object.fromEntries(Object.entries(savedComments).map(function(e){return [e[0]+'_comment',e[1]];})) : {});
    update[section] = num;
    update[section + '_comment'] = comment;
    db.collection('meta').doc('savedSeats').set(update)
      .then(function() { overlay.remove(); })
      .catch(function(e) { alert('שגיאה: ' + e.message); });
  };
}
</script>
</body>
</html>

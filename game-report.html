<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>דוח משחקים - מכבי נתניה</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--panel2:#1f2330;--border:#2b3040;--text:#e8eaf0;--muted:#9aa3b5;--accent:#f5c518;--accent2:#2dd4a3;--danger:#ef5b5b;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"Segoe UI",Arial,sans-serif;min-height:100vh;padding:20px;font-size:13px}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
  h1{font-size:20px;display:flex;align-items:center;gap:10px}
  h1 .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .back-link{color:var(--muted);text-decoration:none;font-size:13px;border:1px solid var(--border);padding:6px 12px;border-radius:7px}
  .upload-area{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:24px;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
  .upload-group{display:flex;flex-direction:column;gap:6px;flex:1;min-width:200px}
  .upload-group label{font-size:12px;color:var(--muted)}
  .upload-group input[type=text]{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:7px;font-size:13px;width:100%}
  .upload-group select{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:7px;font-size:13px;width:100%;cursor:pointer}
  .upload-group input[type=file]{background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:6px 10px;border-radius:7px;font-size:12px;width:100%}
  .btn{padding:9px 18px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;border:none}
  .btn-primary{background:var(--accent);color:#14161c}
  .btn-secondary{background:var(--panel2);color:var(--muted);border:1px solid var(--border)}
  .btn:hover{opacity:0.85}
  .log{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:16px;font-size:12px;color:var(--muted);display:none}
  .log .ok{color:var(--accent2)}
  .log .err{color:var(--danger)}

  /* Table */
  .table-wrap{overflow-x:auto;margin-top:8px}
  table{border-collapse:collapse;width:100%;min-width:900px}
  th,td{padding:10px 12px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--border)}
  td.date,td.name{text-align:right}
  th{background:var(--panel2);color:var(--muted);font-size:11px;font-weight:600;position:sticky;top:0}
  th.group{background:#1a1d28;color:var(--accent);font-size:10px;text-align:center;border-bottom:2px solid var(--accent)}
  td.date{color:var(--muted);font-size:12px}
  td.name{font-weight:600;color:var(--text)}
  td.num{text-align:center;color:var(--text)}
  td.total{font-weight:700;color:var(--accent)}
  td.sub{color:var(--accent2)}
  td.away{color:#a78bfa}
  td.free{color:var(--muted)}
  tr:hover td{background:#1c2030}
  .no-data{color:var(--muted);text-align:center;padding:40px;font-size:14px}
  .summary-bar{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:16px;padding:12px 16px;background:var(--panel);border:1px solid var(--border);border-radius:10px;font-size:12px;color:var(--muted)}
  .summary-bar b{color:var(--text)}
  .actions{display:flex;gap:8px;margin-bottom:16px}
</style>
</head>
<body>

  <div class="upload-group" style="min-width:90px"><label>בית חינם</label><input type="number" id="manualHomeFree" placeholder="מקובץ" style="background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:7px;font-size:13px;width:100%"></div>
  <div class="upload-group" style="min-width:90px"><label>אורח בתשלום</label><input type="number" id="manualAwayPaid" placeholder="מקובץ" style="background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:7px;font-size:13px;width:100%"></div>

<div class="summary-bar" id="summaryBar" style="display:none"></div>
<div class="summary-bar" id="incomeSummaryBar" style="display:none;border-top:1px solid var(--border);margin-top:-12px;border-radius:0 0 10px 10px"></div>

<div class="table-wrap">
  <table id="reportTable">
    <thead>
      <tr>
        <th rowspan="2">תאריך</th>
        <th rowspan="2">יריב</th>

      </tr>

        <th>מנויים</th><th>בית (כרטיס)</th><th>סה"כ בית</th><th>אורחים</th><th>סה"כ</th>
        <th>בית בתשלום</th><th>בית חינם</th><th>סה"כ בית</th><th>אורח בתשלום</th><th>אורח חינם</th><th>סה"כ כרטיסים</th>

<script>
firebase.initializeApp({apiKey:"AIzaSyCUSlbN3FKmi2h8grZo6ciZOkAS9LfVcQw",authDomain:"fcmn-renewals-26-27.firebaseapp.com",projectId:"fcmn-renewals-26-27",storageBucket:"fcmn-renewals-26-27.firebasestorage.app",messagingSenderId:"681981226078",appId:"1:681981226078:web:9db5a9aedee0c56193d8cf"});
const db = firebase.firestore();

let games = [];

function log(msg, cls='') {
  const el = document.getElementById('logEl');
  el.style.display = 'block';
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = msg;
  el.appendChild(d);
}

function readExcel(file) {
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload = e => {
      const wb = XLSX.read(e.target.result, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      res(XLSX.utils.sheet_to_json(ws));
    };
    reader.onerror = rej;
    reader.readAsArrayBuffer(file);
  });
}

function parseDate(str) {
  if (!str) return new Date(0);
  // Handle dd/mm/yyyy or dd.mm.yyyy
  const m = str.match(/(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})/);
  if (m) return new Date(parseInt(m[3]), parseInt(m[2])-1, parseInt(m[1]));
  return new Date(str);
}
function formatDate(str) {
  const d = parseDate(str);
  if (!d || isNaN(d)) return str;
  return d.toLocaleDateString('he-IL', {day:'2-digit',month:'2-digit',year:'numeric'});
}

async function loadGames() {
  try {
    const snap = await db.collection('gameReports').get();
    games = [];
    snap.forEach(d => games.push(d.data()));
    games.sort((a,b) => parseDate(a.date) - parseDate(b.date));
    renderTable();
  } catch(e) { console.error('Load error:', e); }
}

// Load games from gamesConfig and populate dropdown
async function loadGamesDropdown() {
  try {
    const snap = await db.collection('gamesConfig').get();
    const games = [];
    snap.forEach(doc => { const d = doc.data(); if (d.eventId && d.name) games.push(d); });
    // Sort by date ascending
    games.sort((a, b) => {
      const da = a.date ? new Date(a.date) : new Date(0);
      const db2 = b.date ? new Date(b.date) : new Date(0);
      return da - db2;
    });
    const sel = document.getElementById('gameSelect');
    sel.innerHTML = '<option value="">-- בחר משחק --</option>';
    const now = Date.now();
    let nextIdx = -1;
    games.forEach((g, i) => {
      const opt = document.createElement('option');
      opt.value = JSON.stringify(g);
      const d = g.date ? new Date(g.date) : null;
      const dateStr = d ? d.toLocaleDateString('he-IL', {day:'2-digit',month:'2-digit',year:'numeric'}) : '';
      opt.textContent = g.name + (dateStr ? ' · ' + dateStr : '');
      sel.appendChild(opt);
      if (nextIdx === -1 && d && d.getTime() >= now - 86400000*1) nextIdx = i + 1; // +1 for blank option
    });
    if (nextIdx > 0) sel.selectedIndex = nextIdx;
  } catch(e) { console.warn('Could not load games:', e); }
}
loadGamesDropdown();

document.getElementById('processBtn').addEventListener('click', async () => {
  const selVal = document.getElementById('gameSelect').value;
  if (!selVal) { alert('נא לבחור משחק'); return; }
  const selGame = JSON.parse(selVal);
  const d = selGame.date ? new Date(selGame.date) : new Date();
  const date = d.toLocaleDateString('he-IL', {day:'2-digit',month:'2-digit',year:'numeric'});
  const opponent = selGame.opponent || selGame.name || '';
  const entranceFile = document.getElementById('entranceFile').files[0];
  const ticketsFile = document.getElementById('ticketsFile').files[0];

  if (!opponent || !entranceFile) {
    alert('נא לבחור משחק ולהעלות קובץ כניסות');
    return;
  }

  document.getElementById('logEl').innerHTML = '';
  log('מעבד קבצים...');

  const entrance = await readExcel(entranceFile);
  const tickets = ticketsFile ? await readExcel(ticketsFile) : [];
  log('כניסות: ' + entrance.length + ' שורות' + (tickets.length ? ' | כרטיסים: ' + tickets.length + ' שורות' : ' | ללא קובץ כרטיסים'));

  const seasonEntFromFile = tickets.filter(r =>
    String(r['origin']||'').toLowerCase() === 'transfer' &&
    String(r['ticketName']||'').includes('מנוי') &&
    !String(r['category']||'').includes('מזרחי')
  ).length;
  const seasonEnt = entrance.filter(r => r['LFC_ID'] && r['LFC_ID'] !== '');
  const regularEnt = entrance.filter(r => !r['LFC_ID'] || r['LFC_ID'] === '');
  const awayEnt = entrance.filter(r => String(r['Turnstile']||'').startsWith('23'));
  const homeTicketEnt = regularEnt.filter(r => !String(r['Turnstile']||'').startsWith('23'));

  const totalEnt = entrance.length;
  const seasonEntCount = seasonEnt.length + seasonEntFromFile;
  const homeTicketEntCount = homeTicketEnt.length;
  const totalHomeEnt = seasonEntCount + homeTicketEntCount;
  const awayEntCount = awayEnt.length;

  // כרטיסי כניסה = paid/free game tickets only
  const gameTickets = tickets.filter(r => String(r['ticketName']||'').includes('כרטיס כניסה'));
  // Season ticket transfers (מנוי + origin=transfer) = season ticket entrances
  const seasonTransfers = tickets.filter(r =>
    String(r['origin']||'').toLowerCase() === 'transfer' &&
    String(r['ticketName']||'').includes('מנוי') &&
    !String(r['category']||'').includes('מזרחי')
  );
  const homeTickets = gameTickets.filter(r => !String(r['category']||'').includes('מזרחי'));
  const awayTickets = gameTickets.filter(r => String(r['category']||'').includes('מזרחי'));
  const homeFreeExtra = []; // no longer adding transfers to tickets

  const homePaid = homeTickets.filter(r => r['price'] > 0);
  const homeFree = homeTickets.filter(r => !r['price'] || r['price'] === 0);
  const homeFreeTotal = homeFree.length + homeFreeExtra.length;
  const homeTotalAll = homeTickets.length + homeFreeExtra.length;
  const awayPaid = awayTickets.filter(r => r['price'] > 0);
  const awayFree = awayTickets.filter(r => !r['price'] || r['price'] === 0);

  log('✓ כניסות: מנויים ' + seasonEntCount + ' | בית(כרטיס) ' + homeTicketEntCount + ' | אורחים ' + awayEntCount + ' | סה"כ ' + totalEnt, 'ok');
  log('✓ כרטיסים: בית ' + homePaid.length + ' בתשלום + ' + homeFree.length + ' חינם | אורח ' + awayPaid.length + ' בתשלום + ' + awayFree.length + ' חינם', 'ok');

  const gameId = 'game_' + date.replace(/\//g,'_') + '_' + opponent.replace(/\s/g,'_');
  const homeFreeList = homeFree.map(function(r) {
    return { name: String(r['name']||'').trim(), category: String(r['category']||'').trim() };
  });

  // Revenue from file (paid game tickets only)
  var revenueFromFile = 0;
  gameTickets.forEach(function(r) { if(r['price'] > 0) revenueFromFile += Number(r['price']||0); });
  revenueFromFile = Math.round(revenueFromFile);

  var mHP=parseInt(document.getElementById('manualHomePaid').value)||null;
  var mHF=parseInt(document.getElementById('manualHomeFree').value)||null;
  var mAP=parseInt(document.getElementById('manualAwayPaid').value)||null;
  var mAF=parseInt(document.getElementById('manualAwayFree').value)||null;
  var fHP=mHP!==null?mHP:homePaid.length;
  var fHF=mHF!==null?mHF:homeFree.length;
  var fAP=mAP!==null?mAP:awayPaid.length;
  var fAF=mAF!==null?mAF:awayFree.length;

  const game = {
    id: gameId, date, opponent,
    seasonEnt: seasonEntCount, homeTicketEnt: homeTicketEntCount,
    totalHomeEnt, awayEnt: awayEntCount, totalEnt,
    homePaid: fHP, homeFree: fHF,
    homeFreeFromFile: homeFree.length,
    totalHomeTickets: fHP+fHF,
    awayPaid: fAP, awayFree: fAF,
    totalTickets: fHP+fHF+fAP+fAF,
    revenueFromFile: revenueFromFile,
    revenueManual: null, fee: null, cashiers: null, vat: null,
    homeFreeList: homeFreeList
  };

  try {
    await db.collection('gameReports').doc(gameId).set(game);
    games.push(game);
    games.sort((a,b) => parseDate(a.date) - parseDate(b.date));
    renderTable();
    log('✓ המשחק נוסף לטבלה', 'ok');
  } catch(e) { log('שגיאה בשמירה: ' + e.message, 'err'); }
});

async function editOther(idx) {
  const g = games[idx];
  const val = prompt('הזן כמות לחיסור (אחר):', g.otherEnt || 0);
  if (val === null) return;
  const num = parseInt(val) || 0;
  g.otherEnt = num;
  if (g.id) {
    await db.collection('gameReports').doc(g.id).update({ otherEnt: num });
  }
  renderTable();
}

function renderTable() {
  const tbody = document.getElementById('reportBody');
  const actionsBar = document.getElementById('actionsBar');
  const summaryBar = document.getElementById('summaryBar');

  if (games.length === 0) {
    tbody.innerHTML = '<tr><td colspan="14" class="no-data">העלה קבצי כניסות וכרטיסים להוספת משחק</td></tr>';
    actionsBar.style.display = 'none';
    summaryBar.style.display = 'none';
    return;
  }

  actionsBar.style.display = 'flex';
  summaryBar.style.display = 'flex';

  const totEnt = games.reduce((s,g) => s+g.totalEnt, 0);
  const totHome = games.reduce((s,g) => s+g.totalHomeEnt, 0);
  const totAway = games.reduce((s,g) => s+g.awayEnt, 0);
  const totTix = games.reduce((s,g) => s+g.totalTickets, 0);
  summaryBar.innerHTML =
    '<span>משחקים: <b>' + games.length + '</b></span>' +
    '<span>סה"כ כניסות: <b>' + totEnt.toLocaleString() + '</b></span>' +
    '<span>ממוצע כניסות: <b>' + Math.round(totEnt/games.length).toLocaleString() + '</b></span>' +
    '<span>סה"כ כניסות בית: <b>' + totHome.toLocaleString() + '</b></span>' +
    '<span>סה"כ כניסות אורחים: <b>' + totAway.toLocaleString() + '</b></span>' +
    '<span>סה"כ כרטיסים: <b>' + totTix.toLocaleString() + '</b></span>';

  // Income summary bar
  var incBar = document.getElementById('incomeSummaryBar');
  var iRF=games.reduce(function(s,g){return s+(g.revenueFromFile||0);},0);
  var iRM=games.reduce(function(s,g){return s+(g.revenueManual||0);},0);
  var iFee=games.reduce(function(s,g){return s+(g.fee||0);},0);
  var iCash=games.reduce(function(s,g){return s+(g.cashiers||0);},0);
  var iVat=games.reduce(function(s,g){return s+(g.vat||0);},0);
  var iGross=iRM||iRF; var iNet=iGross-iFee-iCash-iVat;
  var iAvg=games.length>0?Math.round(iNet/games.length):0;
  incBar.style.display = 'flex';
  incBar.innerHTML =
    '<span style="color:var(--accent2)">💰 הכנסות:</span>' +
    '<span>ברוטו: <b style="color:var(--accent2)">₪' + iGross.toLocaleString() + '</b></span>' +
    '<span>עמלה: <b style="color:var(--danger)">₪' + iFee.toLocaleString() + '</b></span>' +
    '<span>קופאים: <b style="color:var(--danger)">₪' + iCash.toLocaleString() + '</b></span>' +
    '<span>מע"מ: <b style="color:var(--danger)">₪' + iVat.toLocaleString() + '</b></span>' +
    '<span>נטו: <b style="color:var(--accent);font-size:14px">₪' + iNet.toLocaleString() + '</b></span>' +
    '<span>ממוצע נטו למשחק: <b style="color:var(--accent2)">₪' + iAvg.toLocaleString() + '</b></span>';

  window._gameData = games;
  tbody.innerHTML = games.map(function(g, i) { return '<tr>' +
    '<td class="date">' + formatDate(g.date) + '</td>' +
    '<td class="name">' + g.opponent + '</td>' +
    '<td class="num sub">' + g.seasonEnt.toLocaleString() + '</td>' +
    '<td class="num sub">' + g.homeTicketEnt.toLocaleString() + '</td>' +
    '<td class="num total">' + g.totalHomeEnt.toLocaleString() + '</td>' +
    '<td class="num away">' + g.awayEnt.toLocaleString() + '</td>' +
    '<td class="num total">' + g.totalEnt.toLocaleString() + '</td>' +
    '<td style="background:transparent;border:none;padding:0"></td>' +
    '<td class="num">' + g.homePaid.toLocaleString() + '</td>' +
    (function(){var ff=g.homeFreeFromFile!==undefined?g.homeFreeFromFile:g.homeFree;var diff=g.homeFree!==ff?' <span style="font-size:10px;color:var(--muted)">('+ff+' בקובץ)</span>':'';return '<td class="num free" style="cursor:pointer;text-decoration:underline dotted" onclick="showFreeList('+i+')">' + g.homeFree.toLocaleString() + diff + '</td>';})() +
    '<td class="num sub">' + g.totalHomeTickets.toLocaleString() + '</td>' +
    '<td class="num away">' + g.awayPaid.toLocaleString() + '</td>' +
    '<td class="num free away">' + g.awayFree.toLocaleString() + '</td>' +
    '<td class="num total">' + g.totalTickets.toLocaleString() + '</td>' +
    '<td style="background:transparent;border:none;padding:0"></td>' +
    '<td class="num" style="text-align:center;color:var(--accent2)">' + (g.revenueFromFile ? '₪'+g.revenueFromFile.toLocaleString() : '—') + '</td>' +
    '<td class="num" style="text-align:center;color:var(--accent2);cursor:pointer;text-decoration:underline dotted" onclick="editRevenue(' + i + ')">' + (g.revenueManual ? '₪'+Number(g.revenueManual).toLocaleString() : '✏️') + '</td>' +
    '<td class="num" style="text-align:center;color:var(--muted)">' + (g.fee ? '₪'+Number(g.fee).toLocaleString() : '—') + '</td>' +
    '<td class="num" style="text-align:center;color:var(--muted)">' + (g.cashiers ? '₪'+Number(g.cashiers).toLocaleString() : '—') + '</td>' +
    '<td class="num" style="text-align:center;color:var(--muted)">' + (g.vat ? '₪'+Number(g.vat).toLocaleString() : '—') + '</td>' +
    '<td class="num" style="background:#1a2a1a;text-align:center;cursor:pointer;text-decoration:underline dotted;color:var(--muted)" onclick="editOther(' + i + ')">' + (g.otherEnt ? '-₪'+Number(g.otherEnt).toLocaleString() : '✏️') + '</td>' +
    (function() { var gross = g.revenueManual||g.revenueFromFile||0; var net = gross-(g.fee||0)-(g.cashiers||0)-(g.vat||0)-(g.otherEnt||0); return '<td class="num total" style="text-align:center">'+(gross?'₪'+net.toLocaleString():'—')+'</td>'; })() +
    '</tr>';
  }).join('');


}

document.getElementById('clearBtn').addEventListener('click', async function() {
  if (confirm('למחוק את כל הנתונים?')) {
    for (const g of games) {
      if (g.id) await db.collection('gameReports').doc(g.id).delete();
    }
    games = [];
    renderTable();
  }
});

document.getElementById('exportBtn').addEventListener('click', function() {
  const rows = games.map(function(g) { return {
    'תאריך': g.date, 'יריב': g.opponent,
    'כניסות מנויים': g.seasonEnt, 'כניסות בית (כרטיס)': g.homeTicketEnt,
    'סה"כ כניסות בית': g.totalHomeEnt, 'כניסות אורחים': g.awayEnt,
    'סה"כ כניסות': g.totalEnt, 'כרטיסי בית בתשלום': g.homePaid,
    'כרטיסי בית חינם': g.homeFree, 'סה"כ כרטיסי בית': g.totalHomeTickets,
    'כרטיסי אורח בתשלום': g.awayPaid, 'כרטיסי אורח חינם': g.awayFree,
    'סה"כ כרטיסים': g.totalTickets, 'הכנסות': g.revenue || ''
  }; });
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb, ws, 'דוח משחקים');
  XLSX.writeFile(wb, 'דוח_משחקים_מכבי_נתניה.xlsx');
});

loadGames();

function editRevenue(idx) {
  var g = window._gameData[idx];
  var overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:#0009;z-index:1000;display:flex;align-items:center;justify-content:center';
  var box = document.createElement('div');
  box.style.cssText = 'background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:24px;min-width:320px;direction:rtl';

  var title = document.createElement('div');
  title.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:16px';
  var titleText = document.createElement('b');
  titleText.textContent = g.opponent + ' — עדכון הכנסות';
  var closeBtn = document.createElement('button');
  closeBtn.textContent = '✕';
  closeBtn.style.cssText = 'background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer';
  closeBtn.onclick = function() { overlay.remove(); };
  title.appendChild(titleText);
  title.appendChild(closeBtn);
  box.appendChild(title);

  var fromFile = document.createElement('div');
  fromFile.style.cssText = 'font-size:12px;color:var(--muted);margin-bottom:12px';
  fromFile.textContent = 'מהקובץ: ₪' + (g.revenueFromFile||0).toLocaleString();
  box.appendChild(fromFile);

  var fields = [['revenueManual','ברוטו (ידני)'],['fee','עמלה'],['cashiers','קופאים'],['vat','מע"מ']];
  fields.forEach(function(f) {
    var wrap = document.createElement('div');
    wrap.style.cssText = 'margin-bottom:10px';
    var label = document.createElement('label');
    label.style.cssText = 'font-size:12px;color:var(--muted);display:block;margin-bottom:4px';
    label.textContent = f[1];
    var input = document.createElement('input');
    input.type = 'number';
    input.id = 'rev_' + f[0];
    input.value = g[f[0]] || '';
    input.style.cssText = 'width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:7px;font-size:13px';
    wrap.appendChild(label);
    wrap.appendChild(input);
    box.appendChild(wrap);
  });

  var saveBtn = document.createElement('button');
  saveBtn.textContent = 'שמור';
  saveBtn.style.cssText = 'width:100%;padding:10px;background:var(--accent);color:#14161c;border:none;border-radius:8px;cursor:pointer;font-weight:700;margin-top:4px';
  saveBtn.addEventListener('click', async function() {
    var upd = {};
    fields.forEach(function(f) { upd[f[0]] = parseFloat(document.getElementById('rev_'+f[0]).value)||null; });
    Object.assign(g, upd);
    try {
      await db.collection('gameReports').doc(g.id).update(upd);
      renderTable();
      overlay.remove();
    } catch(e) { alert('שגיאה: ' + e.message); }
  });
  box.appendChild(saveBtn);

  overlay.appendChild(box);
  document.body.appendChild(overlay);
  overlay.addEventListener('click', function(e) { if(e.target===overlay) overlay.remove(); });
}
function showFreeList(idx) {
  const g = window._gameData[idx];
  const list = g.homeFreeList || [];
  const opponent = g.opponent;
  if (!list || !list.length) return;

  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:#0009;z-index:1000;display:flex;align-items:center;justify-content:center';

  const box = document.createElement('div');
  box.style.cssText = 'background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;min-width:380px;max-width:520px;max-height:80vh;overflow-y:auto;direction:rtl';

  const header = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">' +
    '<b style="font-size:15px">כרטיסי חינם - ' + opponent + ' (' + list.length + ')</b>' +
    '<button onclick="this.closest(\'[style*=position]\').remove()" style="background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer">✕</button>' +
    '</div>';

  const colHeader = '<div style="display:grid;grid-template-columns:1fr 100px;gap:8px;font-size:11px;color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--border);margin-bottom:6px">' +
    '<span>שם</span><span style="text-align:center">יציע</span></div>';

  const rows = list.map(function(item, i) {
    return '<div style="display:grid;grid-template-columns:1fr 100px;gap:8px;padding:5px 0;border-bottom:1px solid #20242f;font-size:12px">' +
      '<span>' + (i+1) + '. ' + (item.name||'') + '</span>' +
      '<span style="text-align:center;color:var(--muted);font-size:11px">' + (item.category||'') + '</span>' +
      '</div>';
  }).join('');

  // Export button
  const exportBtn = '<button id="exportFreeBtn" style="margin-top:12px;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:5px 12px;border-radius:7px;cursor:pointer;font-size:12px">📥 ייצא לאקסל</button>';

  box.innerHTML = header + colHeader + rows + exportBtn;
  overlay.appendChild(box);
  document.body.appendChild(overlay);

  overlay.addEventListener('click', function(e) { if(e.target===overlay) overlay.remove(); });

  box.querySelector('#exportFreeBtn').addEventListener('click', function() {
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.json_to_sheet(list.map(function(r) { return {'שם': r.name, 'יציע': r.category}; }));
    XLSX.utils.book_append_sheet(wb, ws, 'כרטיסי חינם');
    XLSX.writeFile(wb, 'כרטיסי_חינם_' + opponent + '.xlsx');
  });
}
</script>
</body>
</html>
